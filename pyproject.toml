[tool.ruff]
line-length = 79
target-version = "py312"
exclude = [
    ".venv",
    ".pytest_cache",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.bandit]
exclude_dirs = [".venv", "tests"]
skips = []
